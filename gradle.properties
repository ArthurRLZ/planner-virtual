kotlin.code.style=official

# Aumenta o heap do Gradle Daemon para o compilador Kotlin WasmJs (IR backend)
# que é muito mais pesado que o compilador JVM padrão.
# Sem isso, o task :compileDevelopmentExecutableKotlinWasmJs lança OutOfMemoryError.
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
